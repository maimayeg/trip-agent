[project]
name = "trip-agent"
version = "0.1.0"
description = "LangChain trip planning agent"
requires-python = ">=3.11"

dependencies = [
    "pydantic-settings>=2.0",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langgraph>=0.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "streamlit>=1.35",
    "langchain-openai>=0.2",
    "langfuse>=2.0"
    ]

[project.optional-dependencies]
dev = [
    "langsmith>=0.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "langserve>=0.2",
]

[tool.setuptools.packages.find]
include = ["tools*", "prompts*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"